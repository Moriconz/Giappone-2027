on": "enables"}, {"source": "module_state", "target": "module_features_gps", "value": 1, "relation": "enables"}, {"source": "integration_google_maps", "target": "integration_reverse_geocoding", "value": 1, "relation": "uses"}, {"source": "integration_unsplash_api", "target": "integration_reverse_geocoding", "value": 1, "relation": "mentions"}, {"source": "capability_pwa", "target": "requirement_https", "value": 1, "relation": "requires"}];
        const communityColors = {"0": "#FF6B6B", "1": "#4ECDC4", "2": "#45B7D1", "3": "#FFA07A", "4": "#98D8C8", "5": "#F7DC6F", "6": "#BB8FCE", "7": "#85C1E2", "8": "#F8B88B", "9": "#A9DFBF", "10": "#F5B7B1", "11": "#D7BDE2", "12": "#F9E79F", "13": "#ABEBC6", "14": "#FAD7A0", "15": "#D5F4E6", "16": "#FADBD8", "17": "#EBD2B9"};

        const width = window.innerWidth;

        // Force simulation
        const simulation = d3.forceSimulation(nodes)
            .force('link', d3.forceLink(links).id(d => d.id).distance(40))
            .force('charge', d3.forceManyBody().strength(-100))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(d => d.value + 5));

        // Draw links
        const link = g.append('g')
            .selectAll('line')
            .data(links)
            .enter()
            .append('line')
            .attr('stroke', '#555')
            .attr('stroke-opacity', 0.4);

        // Draw nodes
        const node = g.append('g')
            .selectAll('circle')
            .data(nodes)
            .enter()
            .append('circle')
            .attr('r', d => d.value)
            .attr('fill', d => communityColors[d.group])
            .attr('stroke', '#e0e0e0')
            .call(drag(simulation));

        // Labels on hover
        const tooltip = d3.select('#tooltip');

        node.on('mouseover', (event, d) => {
            tooltip
                .style('display', 'block')
                .html(`<strong>${d.label}</strong><br>Community ${d.group}<br>Degree: ${links.filter(l => l.source.id === d.id || l.target.id === d.id).length}`)
                .style('left', (event.pageX + 10) + 'px')
                .style('top', (event.pageY - 30) + 'px');
        })
        .on('mouseout', () => { tooltip.style('display', 'none'); });

        simulation.on('tick', () => {

                .attr('y2', d => d.target.y);

                .attr('cy', d => d.y);
        });

        function drag(simulation) {
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
            return d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended);
        }
