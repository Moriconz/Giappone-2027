<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0820" />
  <title>Giappone 2027 · SafeEats</title>
  <link rel="stylesheet" href="./y2k-override.css" />
  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>🌸 SafeEats</h1>
      <button id="install-btn" style="background: linear-gradient(135deg, #00FF88, #00CC66); color: #1A2560; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer;">📱 Aggiungi</button>
    </header>

    <div id="filters">
      <button class="chip active" data-filter="all">🏮 Tutti</button>
      <button class="chip" data-filter="restaurants">🍽️ Ristoranti</button>
      <button class="chip" data-filter="cafes">☕ Caffè</button>
      <button class="chip" data-filter="shops">🛒 Negozi</button>
      <button class="chip" data-filter="hotels">🏨 Hotel</button>
    </div>

    <main>
      <div id="map">
        <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #fff; text-align: center; padding: 20px; box-sizing: border-box;">
          <div style="font-size: 48px; margin-bottom: 20px;">🗾</div>
          <h2 style="margin: 0 0 10px 0; color: #FF6B35;">Mappa in caricamento...</h2>
          <p style="margin: 0; color: rgba(255,255,255,0.7);">OpenLayers library non disponibile nel CDN</p>
          <p style="margin: 10px 0 0 0; font-size: 14px; color: rgba(255,255,255,0.5);">Usa i filtri per esplorare i luoghi</p>
        </div>
      </div>
    </main>

    <!-- SHEETS/MODALS -->
    <div class="sheet" id="sheet">
      <div class="sheet-inner">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h2 id="sheet-title">Dettagli</h2>
          <button class="icon-btn" id="sheet-close">✕</button>
        </div>
        <div class="sheet-body" id="sheet-body">
          <p>Contenuto della finestra</p>
        </div>
      </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom">
      <button class="active" data-view="map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2 3 5v17l6-3 6 3 6-3V2l-6 3-6-3z"/><path d="M9 2v17M15 5v17"/></svg>
        Mappa
      </button>
      <button data-view="list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        Tappe
      </button>
      <button data-view="bookings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8"/><path d="m16 19 2 2 4-4"/></svg>
        Prenota
      </button>
      <button data-view="shopping">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Shopping
      </button>
      <button data-view="group">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Gruppo
      </button>
    </nav>
  </div>

  <div id="toast-container"></div>

  <script>
    console.log('✅ SafeEats Simple UI loaded');

    // Filter buttons
    document.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        console.log('Filter:', this.dataset.filter);
      });
    });

    // Bottom nav
    document.querySelectorAll('nav.bottom button').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('nav.bottom button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        console.log('View:', this.dataset.view);

        // Show sheet example
        const sheet = document.getElementById('sheet');
        document.getElementById('sheet-title').textContent = this.textContent;
        document.getElementById('sheet-body').innerHTML = `<p>Contenuto per: ${this.textContent}</p>`;
        sheet.classList.add('active');
      });
    });

    // Close sheet
    document.getElementById('sheet-close').addEventListener('click', function() {
      document.getElementById('sheet').classList.remove('active');
    });

    // Install button
    document.getElementById('install-btn').addEventListener('click', function() {
      alert('Installa l\'app sul tuo dispositivo');
    });

    console.log('✅ All event listeners attached');
  </script>
</body>
</html>
